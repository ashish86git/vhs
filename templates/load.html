
{% extends "base.html" %}

{% block title %}
Load Vehicle | Vehicle Management System
{% endblock %}


{% block content %}

<style>

    .main-card {
        max-width: 1000px;
        margin: 30px auto;
    }

    .section-title {
        font-weight: 600;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    .required::after {
        content: " *";
        color: red;
    }

</style>


<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm main-card">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">
                Supervisor Load Entry
            </h4>

        </div>


        <div class="card-body">

            <!-- =================================================
                 VEHICLE SUMMARY
            ================================================== -->

            <div class="alert alert-info">

                <strong>Vehicle:</strong>
                {{ vehicle.reg_no }}

                &nbsp; | &nbsp;

                <strong>Type:</strong>
                {{ vehicle.type }}

                &nbsp; | &nbsp;

                <strong>Flow:</strong>

                <span class="badge bg-success">
                    LOAD
                </span>

            </div>


            <form method="POST">

                <!-- =============================================
                     VEHICLE INFORMATION
                ============================================== -->

                <h5 class="section-title">
                    Vehicle Information
                </h5>


                <div class="row g-3">

                    <!-- VEHICLE REG NO -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Vehicle Reg No
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ vehicle.reg_no }}"
                            readonly
                        >

                    </div>


                    <!-- VEHICLE TYPE -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Vehicle Type
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ vehicle.type }}"
                            readonly
                        >

                    </div>


                    <!-- TRANSPORTER -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Transporter
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ vehicle.transporter or '' }}"
                            readonly
                        >

                    </div>


                    <!-- SUPPLIER -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Supplier
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ vehicle.supplier or '' }}"
                            readonly
                        >

                    </div>

                </div>


                <hr class="my-4">


                <!-- =============================================
                     LOAD DETAILS
                ============================================== -->

                <h5 class="section-title">
                    Load Details
                </h5>


                <div class="row g-3">

                    <!-- LR NUMBER -->

                    <div class="col-md-6">

                        <label class="form-label required">
                            LR Number
                        </label>

                        <input
                            type="text"
                            name="load_lr_number"
                            class="form-control"
                            value="{{ vehicle.load_lr_number or '' }}"
                            required
                        >

                    </div>


                    <!-- INVOICE DISPATCH -->

                    <div class="col-md-6">

                        <label class="form-label required">
                            No of invoice Dispatch
                        </label>

                        <input
                            type="text"
                            name="load_invoice_number"
                            class="form-control"
                            value="{{ vehicle.load_invoice_number or '' }}"
                            required
                        >

                    </div>


                    <!-- DISPATCH QTY -->

                    <div class="col-md-6">

                        <label class="form-label required">
                            Dispatch QTY
                        </label>

                        <input
                            type="number"
                            step="any"
                            name="load_invoice_qty"
                            class="form-control"
                            value="{{ vehicle.load_invoice_qty or '' }}"
                            required
                        >

                    </div>


                    <!-- DISPATCH BOXES -->

                    <div class="col-md-6">

                        <label class="form-label required">
                            Dispatch No. Of Boxes
                        </label>

                        <input
                            type="number"
                            name="load_number_of_boxes"
                            class="form-control"
                            value="{{ vehicle.load_number_of_boxes or '' }}"
                            required
                        >

                    </div>

                </div>


                <!-- =============================================
                     REMARKS
                ============================================== -->

                <div class="mb-3 mt-4">

                    <label class="form-label">
                        Remarks
                    </label>

                    <textarea
                        name="remarks"
                        class="form-control"
                        rows="3"
                    >{{ vehicle.outbound_remarks or '' }}</textarea>

                </div>


                <!-- =============================================
                     BUTTONS
                ============================================== -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Submit Load
                    </button>


                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        Back
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
